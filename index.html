let toastTimer;
function showToast(msg){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';document.body.appendChild(el);}el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600);}
list.addEventListener('click',e=>{const cb=e.target.closest('.copy');if(cb){e.preventDefault();copyUrl(cb.closest('.item').querySelector('a').href);return;}const a=e.target.closest('a[href]');if(a&&inPreview){e.preventDefault();copyUrl(a.href);}});
